services:
    postgres:
        image: postgres:16-alpine
        container_name: relay-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: relay
            POSTGRES_USER: relay
            POSTGRES_PASSWORD: relay
        ports:
            - '5432:5432'
        volumes:
            - relay-pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U relay -d relay']
            interval: 5s
            timeout: 3s
            retries: 10

    minio:
        image: quay.io/minio/minio:latest
        container_name: relay-minio
        restart: unless-stopped
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: relay
            MINIO_ROOT_PASSWORD: relay-secret
        ports:
            - '9000:9000'
            - '9001:9001'
        volumes:
            - relay-minio:/data
        healthcheck:
            test: ['CMD', 'mc', 'ready', 'local']
            interval: 5s
            timeout: 3s
            retries: 10

    minio-createbucket:
        image: quay.io/minio/mc:latest
        container_name: relay-minio-setup
        depends_on:
            minio:
                condition: service_healthy
        entrypoint:
            [
                '/bin/sh',
                '-c',
                'mc alias set local http://minio:9000 relay relay-secret && mc mb --ignore-existing local/relay-attachments && mc anonymous set none local/relay-attachments',
            ]

volumes:
    relay-pgdata:
    relay-minio:
