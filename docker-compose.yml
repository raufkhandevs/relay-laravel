services:
    postgres:
        image: postgres:16-alpine
        container_name: relay-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: relay
            POSTGRES_USER: relay
            POSTGRES_PASSWORD: relay
        ports:
            - '5432:5432'
        volumes:
            - relay-pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U relay -d relay']
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    relay-pgdata:
